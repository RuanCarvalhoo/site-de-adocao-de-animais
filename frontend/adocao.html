<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="src/styles/styles.css">
    <link rel="stylesheet" href="src/styles/header.css">
    <link rel="stylesheet" href="src/styles/adocao.css"> <title>Adote um Pet - Bob</title>
</head>
<body>
    <header>
        <nav id="navbar">
            <a href="index.html#home" id="nav_logo"><i class="fa-solid fa-paw"></i> Adota Aqui</a>
            <ul id="nav_list">
                <li class="nav-item"><a href="index.html#home">Ínicio</a></li>
                <li class="nav-item"><a href="index.html#pets">Animais</a></li>
                <li class="nav-item"><a href="index.html#testimonials">Avaliações</a></li>
            </ul>
            
        </nav>
    </header>

    <div id="banner_title">
        <h1>Adote um pet</h1>
    </div>

    <main id="pet_details_container">
        <nav class="breadcrumb">
            <a href="index.html">Animais</a> &gt; <span class="active">Carregando...</span>
        </nav>

        <section id="pet_info_section">
            <div class="pet_image_col">
                <img src="" alt="Foto do pet">
                <div class="image_dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot active"></span>
                </div>
            </div>

            <div class="pet_data_col">
                <h2 class="pet_name">Carregando...</h2>
                <ul class="pet_specs"></ul>
                
                <button class="btn-default" id="btn_adotar_pet">Carregando...</button>
            </div>
        </section>
    </main>
    <script src="src/styles/api.js"></script>
