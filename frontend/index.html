<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bibliotecas de icones, animaçoes, fontes  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/styles/styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://unpkg.com/scrollreveal"></script>
    
    <title>Adota aqui!</title> <!-- Site responsivo!! -->

</head>

<body>
    <header> <!-- HEADER - Nav bar, logo -->
        <nav id="navbar">
            <a href="#home" id="nav_logo"><i class="fa-solid fa-paw"></i> Adota Aqui</a>

            <ul id="nav_list">
                <li class="nav-item active">
                    <a href="#home">Ínicio</a>
                </li>
                <li class="nav-item">
                    <a href="#pets">Animais</a>
                </li>
                <li class="nav-item">
                    <a href="#testimonials">Avaliações</a>
                </li>
            </ul>

            <button id="mobile_btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav>

        <div id="mobile_menu">
            <ul id="mobile_nav_list">
                <li class="nav-item"><a href="#home">Ínicio</a></li>
                <li class="nav-item"><a href="#pets">Animais</a></li>
                <li class="nav-item"><a href="#testimonials">Avaliações</a></li>
            </ul>
        </div>
    </header>

    <main id="content">
        <section id="home">
            
            <div class="shape"></div>
            
            <div id="cta">
                <h1 class="title" id="home_title"></h1>

                <p class="description" id="home_description"></p>

                <div id="cta_buttons">
                    <a href="#pets" class="btn-default" id="cta_animais_btn"></a>
                    <a href="tel:+55555" id="phone_button">
                        <button class="btn-default">
                            <i class="fa-solid fa-phone"></i>
                        </button>
                        <span id="phone_text"></span>
                    </a>
                </div>
                
                <div class="social-media-buttons" id="home_social_links"></div>
            </div> <div id="banner">
                <img src="src/images/cachorroegato.png">
            </div>
        </section>
        
        <!-- Menu de animais -->
        <section id="pets"> 
            <h2 class="section-title" id="pets_title"></h2>
            <h3 class="section-subtitle" id="pets_subtitle"></h3>

        <div id="animais"></div>
        </section>

        <section id="testimonials">         <!-- Menu feedbacks do trabalho da ong -->

            <img src="src/images/homemecachorro.png" id="testimonial_man"width="300">

            <div id="testimonials_content">
                <h2 class="section-title" id="testimonials_title"></h2>
                <h3 class="section-subtitle" id="testimonials_subtitle"></h3>

                <div id="feedbacks">
                    <div id="testimonials_list"></div>
                    <button class="btn-default" id="btn_ver_mais" type="button" hidden>
                        Ver mais
                    </button>
                </div>
            </div>
        </section>
        
    </main>
    <footer>
        <img src="src/images/wave.svg">

        <div id="footer_items">
            <span id="copyright"></span>

                <div class="social-media-buttons" id="footer_social_links"></div>
        </div>
    </footer>
    
    <script src="src/styles/script.js"></script>
    <script src="src/styles/api.js"></script>

</body>
</html>
